name: fct-erp

x-backend-common: &backend-common
  build:
    context: ../auth-service/Backend
  environment: &backend-env
    SECRET_KEY: ${SECRET_KEY:-change-me-in-prod}
    DEBUG: ${DEBUG:-false}
    DATABASE_URL: ${DATABASE_URL:-postgres://fct:fct@db:5432/fct_erp}
    REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
    COOKIE_SECURE: ${COOKIE_SECURE:-true}
    CORS_ALLOW_ALL_ORIGINS: "true"
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_started

services:
  db:
    image: postgres:16-alpine
    profiles: ["infra"]
    environment:
      POSTGRES_USER: fct
      POSTGRES_PASSWORD: fct
      POSTGRES_DB: fct_erp
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fct -d fct_erp"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    profiles: ["infra"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"

  backend-setup:
    <<: *backend-common
    profiles: ["app"]
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed_catalog &&
             python manage.py seed_org &&
             python manage.py seed_masters"
    restart: "no"

  backend:
    <<: *backend-common
    profiles: ["app"]
    command: ["gunicorn", "core.wsgi:application", "--bind", "0.0.0.0:8000", "--workers", "3", "--timeout", "60"]
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: ../ams/frontend
    profiles: ["app"]
    environment:
      API_BASE_URL: http://backend:8000/api
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata: